<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Demo — User Manager</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #333; }
    form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    button { padding: 10px 20px; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
    button:hover { background: #0060d3; }
    #message { padding: 10px; border-radius: 4px; margin-bottom: 12px; display: none; }
    #message.success { background: #d4edda; color: #155724; display: block; }
    #message.error { background: #f8d7da; color: #721c24; display: block; }
    #user-list { list-style: none; padding: 0; }
    #user-list li { padding: 10px; border: 1px solid #eee; border-radius: 4px; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>User Manager</h1>

  <form id="user-form">
    <input
      type="text"
      id="name-input"
      data-testid="user-name-input"
      placeholder="Full name"
      required
    />
    <input
      type="email"
      id="email-input"
      data-testid="user-email-input"
      placeholder="Email address"
      required
    />
    <button type="submit" data-testid="submit-button">Create User</button>
  </form>

  <div id="message" data-testid="message"></div>

  <h2>Users</h2>
  <ul id="user-list" data-testid="user-list"></ul>

  <script>
    const API = '';

    async function loadUsers() {
      const res = await fetch(`${API}/users`);
      const users = await res.json();
      const list = document.getElementById('user-list');
      list.innerHTML = users.map(u =>
        `<li data-testid="user-item-${u.id}"><strong>${u.name}</strong> — ${u.email}</li>`
      ).join('') || '<li>No users yet</li>';
    }

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = type;
      setTimeout(() => { el.style.display = 'none'; el.className = ''; }, 4000);
    }

    document.getElementById('user-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name-input').value.trim();
      const email = document.getElementById('email-input').value.trim();

      const res = await fetch(`${API}/users`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email })
      });

      const data = await res.json();

      if (res.ok) {
        showMessage(`User "${data.name}" created successfully!`, 'success');
        document.getElementById('user-form').reset();
        loadUsers();
      } else {
        showMessage(`Error: ${data.error}`, 'error');
      }
    });

    loadUsers();
  </script>
</body>
</html>
